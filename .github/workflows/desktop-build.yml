name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/tauri-desktop-installers
      - desktop-tauri-build
    paths:
      - "Start.py"
      - "XianyuAutoAsync.py"
      - "app/**"
      - "utils/**"
      - "frontend/**"
      - "static/**"
      - "desktop/**"
      - "requirements.txt"
      - "global_config.yml"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 11 x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: xianyu-workbench-windows-x64
            artifact_path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: xianyu-workbench-macos-arm64
            artifact_path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: xianyu-workbench-macos-x64
            artifact_path: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/src-tauri/resources/playwright
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements.txt -r desktop/requirements-build.txt

      - name: Build React frontend
        shell: bash
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Install bundled Chromium
        shell: bash
        run: |
          rm -rf "$PLAYWRIGHT_BROWSERS_PATH"
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install chromium

      - name: Verify desktop source contract
        shell: bash
        run: python desktop/scripts/verify_desktop_source.py

      - name: Run desktop and delivery regression tests
        shell: bash
        run: >-
          python -m unittest
          tests.test_desktop_runtime
          tests.test_slider_stealth_engine
          tests.test_delivery_rules_migration
          tests.test_log_sanitizer
          tests.test_delivery_rule_scopes
          tests.test_product_variant_delivery

      - name: Ad-hoc sign bundled Chromium on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          while IFS= read -r app_bundle; do
            codesign --force --deep --sign - "$app_bundle"
          done < <(find "$PLAYWRIGHT_BROWSERS_PATH" -type d -name '*.app' -print)

      - name: Build Python sidecar
        shell: bash
        run: python desktop/scripts/build_backend.py --target "${{ matrix.target }}"

      - name: Smoke-test packaged backend
        shell: bash
        run: >-
          python desktop/scripts/smoke_backend.py
          --target "${{ matrix.target }}"
          --playwright-dir "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Install Tauri CLI
        shell: bash
        run: npm install --prefix desktop --no-audit --no-fund

      - name: Generate platform icons
        shell: bash
        run: npm --prefix desktop run icon

      - name: Build Tauri installer
        shell: bash
        run: >-
          npm --prefix desktop run tauri -- build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"

      - name: Write checksums
        shell: bash
        run: |
          python - <<'PY'
          import glob, hashlib, os, pathlib
          pattern = os.environ["ARTIFACT_PATTERN"]
          files = [pathlib.Path(p) for p in glob.glob(pattern)]
          if not files:
              raise SystemExit(f"No installer matched: {pattern}")
          out = pathlib.Path("desktop") / f"SHA256SUMS-{os.environ['TARGET']}.txt"
          with out.open("w", encoding="utf-8") as fh:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  fh.write(f"{digest}  {path.name}\n")
          print(out.read_text())
          PY
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact_path }}
          TARGET: ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact_path }}
            desktop/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14
