<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>闲鱼工作台</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f6f2; color: #171717; }
    .card { width: min(520px, calc(100vw - 48px)); padding: 44px; border: 1px solid #e5e2d6; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px rgba(0,0,0,.08); text-align: center; }
    .logo { width: 84px; height: 84px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 22px; background: #ffe815; font-size: 46px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0; color: #666; line-height: 1.65; }
    .spinner { width: 30px; height: 30px; margin: 28px auto 0; border: 3px solid #eee; border-top-color: #191919; border-radius: 50%; animation: spin .85s linear infinite; }
    .error { display: none; margin-top: 24px; padding: 14px; border-radius: 12px; background: #fff1f0; color: #a8071a; text-align: left; white-space: pre-wrap; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">闲</div>
    <h1>正在启动闲鱼工作台</h1>
    <p id="status">正在准备本地后端、数据库与浏览器组件。首次启动可能稍慢。</p>
    <div id="spinner" class="spinner" aria-label="加载中"></div>
    <div id="error" class="error"></div>
  </main>
  <script>
    window.__setStartupStatus = (message) => {
      document.getElementById('status').textContent = message;
    };
    window.__setStartupError = (message) => {
      document.getElementById('spinner').style.display = 'none';
      const error = document.getElementById('error');
      error.textContent = message;
      error.style.display = 'block';
      document.getElementById('status').textContent = '启动失败';
    };
  </script>
</body>
</html>
