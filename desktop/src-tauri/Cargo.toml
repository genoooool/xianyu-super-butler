[package]
name = "xianyu-workbench"
version = "1.0.3"
description = "闲鱼工作台桌面客户端"
authors = ["genoooool"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "=2.11.0"
semver = "1"
flate2 = "1"
tar = "0.4"
tokio = { version = "1.47", features = ["time", "macros", "sync"] }
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4.18.0"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
